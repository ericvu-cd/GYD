<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#234e40"><title>阿紫的官義渡 · 生態探索</title><link rel="stylesheet" href="style.css?v=3"><link rel="stylesheet" href="mobile.css?v=3"><link rel="stylesheet" href="full19.css?v=3"></head>
<body>
<main id="app"><header><button class="brand" id="brand" aria-label="關於這段旅程"><span class="brand-mark">❦</span><span>阿紫的官義渡<small>完整19站討論版 v0.3</small></span></button><button id="sound" class="icon-btn" aria-label="開啟音效"></button><button id="profile" class="avatar" aria-label="個人設定">旅</button></header>
<div class="view" id="mapView"><div class="map-top"><span class="pill"><i></i> A～S 全園地圖</span><button class="pill" id="modeBtn">模擬定位 ▾</button></div><div id="mapViewport" aria-label="可拖曳縮放的園區手繪地圖"><div id="world"><img id="mapImage" src="assets/map.webp" alt="官義渡生態園區水彩手繪全景圖" draggable="false"><svg id="routeSvg" viewBox="0 0 1200 832" aria-hidden="true"></svg><div id="markers"></div><div id="player"><div class="player-ring"></div><span>●</span><small>我在這裡</small></div></div></div><div class="map-side"><button id="zoomIn" aria-label="放大地圖">＋</button><button id="zoomOut" aria-label="縮小地圖">−</button><button id="locate" aria-label="回到我的位置">◎</button><button id="fit" aria-label="查看全園區">⛶</button></div><div class="map-legend" id="locationStatus">模擬探索 · 點選節點開始旅程</div><article id="missionCard" class="mission-card"></article></div>
<section class="view page hidden" id="tasksView"></section><section class="view page hidden" id="wikiView"></section><section class="view page hidden" id="passportView"></section>
<nav><button class="active" data-tab="map"><span data-icon="map"></span>地圖</button><button data-tab="tasks"><span data-icon="flag"></span>任務</button><button data-tab="wiki"><span data-icon="leaf"></span>共筆</button><button data-tab="passport"><span data-icon="book"></span>護照<span id="badgeDot"></span></button></nav></main>
<div id="overlay" class="overlay hidden"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-grip"></div><button id="closeSheet" class="close" aria-label="關閉視窗">×</button><div id="sheetContent"></div></section></div><div id="toast" role="status"></div><canvas id="confetti"></canvas><script src="trail-data.js?v=3"></script><script src="game-rules.js?v=3"></script><script src="app.js?v=3"></script><script src="full19.js?v=3"></script></body></html>
